version: '3.9'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saiv-dashboard
    environment:
      - PROM_METRICS_PORT=9101
    ports:
      - "8501:8501"
      - "9101:9101"

  prometheus:
    image: prom/prometheus:latest
    container_name: saiv-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - dashboard

  grafana:
    image: grafana/grafana:latest
    container_name: saiv-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
